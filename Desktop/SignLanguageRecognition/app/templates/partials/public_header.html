<header class="sticky top-0 z-30 border-b border-line bg-white/95 backdrop-blur">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center gap-x-4 gap-y-3 px-4 py-3 sm:px-6">
        <a href="{{ url_for('landing.index') }}" class="flex items-center gap-3">
            <span class="flex h-9 w-9 items-center justify-center rounded-lg bg-navy text-white">
                <i class="fa-solid fa-hand-sparkles"></i>
            </span>
            <span class="leading-tight">
                <span class="block text-sm font-semibold text-navy">MSL Recognition</span>
                <span class="block text-[11px] text-slate-500">Computer vision &amp; machine learning</span>
            </span>
        </a>

        <nav class="order-3 flex w-full items-center gap-5 overflow-x-auto text-sm font-medium text-navy-muted md:order-none md:ml-auto md:w-auto" aria-label="Public pages">
            <a href="{{ url_for('landing.index') }}" class="whitespace-nowrap hover:text-accent {% if request.endpoint == 'landing.index' %}text-accent{% endif %}" {% if request.endpoint == 'landing.index' %}aria-current="page"{% endif %}>Home</a>
            <a href="{{ url_for('landing.about') }}" class="whitespace-nowrap hover:text-accent {% if request.endpoint == 'landing.about' %}text-accent{% endif %}" {% if request.endpoint == 'landing.about' %}aria-current="page"{% endif %}>About</a>
            <a href="{{ url_for('landing.developer') }}" class="whitespace-nowrap hover:text-accent {% if request.endpoint == 'landing.developer' %}text-accent{% endif %}" {% if request.endpoint == 'landing.developer' %}aria-current="page"{% endif %}>Developer</a>
        </nav>

        <div class="ml-auto flex items-center gap-2 md:ml-0">
            {% if current_user.is_authenticated %}
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">Open dashboard</a>
            {% else %}
            <a href="{{ url_for('auth.login_page') }}" class="btn btn-secondary">Sign in</a>
            <a href="{{ url_for('auth.register_page') }}" class="btn btn-primary">Create account</a>
            {% endif %}
        </div>
    </div>
</header>
